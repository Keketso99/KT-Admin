<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KT Admin - offline</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;box-sizing:border-box;text-align:center}
  .wrap img{width:96px;height:96px;object-fit:contain}
  .msg{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:500}
  .msg svg{width:30px;height:30px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <img src="icons/icon-192.png" alt="KT">
  <div class="msg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><path d="m2 2 20 20"/></svg>
    <span>You're offline</span>
  </div>
</div>
<script>
  // Open the app again as soon as the connection is back.
  function check(){
    fetch("manifest.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if(r.ok) location.replace("admin.html"); })
      .catch(function(){});
  }
  window.addEventListener("online", check);
  setInterval(check, 3000);
</script>
</body>
</html>
