Pendings

</tr>
<tr>

<tr>

</tr>
<tr>
<td>Password Resets</td>
<td id="pendingPasswordResets"></td>

<tr>
<td>Pin Resets</td>

</tr>

<!-- Quick Actions -->
<div class="dquick-card">
<h3>
Quick Actions
</h3>

<button class="btn-success"
onclick="loadAdminPage('deposits')">
<i class="fa-solid fa-check"></i>
Approve Deposits
</button>

onclick="loadAdminPage('plans')">

</button>

onclick="loadAdminPage('withdrawals')">
