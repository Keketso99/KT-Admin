

<div class="plan-page">
    <div class="plan-header">
        <h2>
          <i class="fa-solid fa-coins"></i>
            Manage Mining Plans
        </h2>
    </div>
        <button class="plan-add-btn">
            <i class="fa-solid fa-plus"></i>
            Add new plan
        </button>
    
    <div class="plan-table">
        <table>

            <thead>

                <tr>

                    <th>Plan Name</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="planList">

            </tbody>


        </table>


    </div>



</div>





<!-- PLAN DETAILS MODAL -->


<div class="plan-modal" id="planModal">


    <div class="plan-modal-content">


        <div class="plan-modal-header">


            <h3>
                Add mining plan
            </h3>


            <button class="plan-close-top">
                &times;
            </button>


        </div>

              

        <p class="plan-subscriber-count" id="planSubscriberCount" style="display:none; margin: -8px 0 12px; font-size: 13px; color: var(--muted, #6b7280);">
            <!-- filled in by JS when viewing an existing plan -->
        </p>

        


        <div class="plan-form">


            <label>
                Plan Name
            </label>

            <input id="planName" type="text">



            <label>
                Price
            </label>

            <input id="planPrice" type="number">



            <label>
                Duration (Days)
            </label>

            <input id="planDuration" type="number">



            <label>
                Daily Return
            </label>

            <input id="planDailyReturn" type="number">



            <label>
                Total Return
            </label>

            <input id="planTotalReturn" type="number">



            <label>
                Hash Power
            </label>

            <input id="planHashPower" type="text">



            <label>
                Status
            </label>

            <select id="planStatus">

                <option value="active">
                    Active
                </option>

                <option value="disabled">
                    Disabled
                </option>

            </select>



        </div>




        <div class="plan-modal-actions">


            <button class="plan-save-btn">
                Save Changes
            </button>


            <button class="plan-toggle-btn">
                Deactivate
            </button>


            <button class="plan-delete-btn">
                Delete
            </button>


            <button class="plan-close-btn">
                Close
            </button>


        </div>



    </>


</div>

<!-- DELETE CONFIRMATION MODAL -->

<div class="plan-delete-confirm-modal" id="planDeleteConfirmModal">

    <div class="plan-delete-confirm-content">

        <div class="plan-delete-confirm-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h3>
           Confirm Delete
        </h3>

        <p id="deletePlanMessage">
    Are you sure you want to delete this mining plan?
</p>

        <div class="plan-delete-confirm-actions">

            <button
                type="button"
                class="plan-delete-cancel-btn">
                Cancel
            </button>

            <button
                type="button"
                class="plan-delete-confirm-btn">
                Delete
            </button>

        </div>

    </div>

</div>
