<div class="notifications-page">

    <!-- Header -->
    <div class="notifications-header">
        <h2>
            <i class="fa-solid fa-bell"></i>
            Notifications
        </h2>
    </div>

        <button class="send-btn" onclick="openNotificationModal()">
            <i class="fa-solid fa-paper-plane"></i>
            Send Notification
        </button>

    <!-- Statistics -->

    <div class="notification-stats">

        <div class="notification-card">
            <h4>Total</h4>
            <span id="totalNotifications">0</span>
        </div>

        <div class="notification-card">
            <h4>Unread</h4>
            <span id="unreadNotifications">0</span>
        </div>

        <div class="notification-card">
            <h4>Read</h4>
            <span id="readNotifications">0</span>
        </div>

    </div>

    <!-- Tabs -->

    <div class="notification-tabs">

        <button class="tab-btn active"
        onclick="showNotificationTab('all',this)">
            All
        </button>

        <button class="tab-btn"
        onclick="showNotificationTab('unread',this)">
            Unread
        </button>

        <button class="tab-btn"
        onclick="showNotificationTab('read',this)">
            Read
        </button>

    </div>

    <!-- List -->

    <div class="notification-list" id="notificationList">

        <!-- Rows are injected from notificationsData in notifications.js -->

    </div>

</div>

<!-- View Modal -->

<div class="notification-modal" id="notificationModal">

    <div class="notification-box">

        <h3>
            Notification Details
        </h3>

        <div id="notificationDetails"></div>

        <div class="modal-buttons">

            <button class="mark-read-btn" onclick="markRead()">
                Mark Read
            </button>

            <button class="delete-notif-btn" onclick="deleteNotification()">
                Delete
            </button>

            <button class="close-btn" onclick="closeNotificationModal()">
                Close
            </button>

        </div>

    </div>

</div>

<!-- Send Notification Modal -->

<div class="notification-modal"
id="sendNotificationModal">

    <div class="notification-box">

        <h3>Send Notification</h3>

        <input
        type="text"
        id="notificationTitle"
        placeholder="Title">

        <textarea
        id="notificationMessage"
        placeholder="Message"></textarea>

        <select id="notificationAudience">

            <option>All Users</option>

            <option>Verified Users</option>

            <option>Active Investors</option>

            <option>Specific User</option>

        </select>

        <div class="modal-buttons">

            <button class="send-notif-btn" onclick="sendNotification()">
                Send
            </button>

            <button class="cancel-btn" onclick="closeSendNotificationModal()">
                Cancel
            </button>

        </div>

    </div>

</div>

<!-- Delete Confirmation Modal -->
<div class="notification-delete-modal" id="deleteConfirmModal">

    <div class="notification-delete-box">

        <div class="notification-delete-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h3>Delete Notification</h3>

        <p>
            Are you sure you want to delete this notification?
        </p>

        <div class="notification-delete-buttons">

            <button class="notification-delete-btn" onclick="confirmDeleteNotification()">
                Delete
            </button>

            <button class="notification-cancel-btn" onclick="closeDeleteConfirmModal()">
                Cancel
            </button>

        </div>

    </div>

</div>
