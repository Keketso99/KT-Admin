<!-- KT CLOUD MINING ADMIN - MANUAL (AI how-to guide) -->
<div class="kt-man" id="ktManual">
    <div class="kt-man-head">
        <h2><i class="fa-solid fa-book-open"></i> Manual</h2>
        <p>Ask how to do anything in the admin app.</p>
    </div>

    <div class="kt-man-chat">
        <div class="kt-man-msgs" id="manMsgs"></div>
        <div class="kt-man-chips" id="manChips">
            <button type="button">How do I approve a withdrawal?</button>
            <button type="button">How do I reset a user's password?</button>
            <button type="button">How do I set my admin nickname?</button>
            <button type="button">How do I send a notification?</button>
        </div>
        <form class="kt-man-form" id="manForm" autocomplete="off">
            <input type="text" id="manInput" maxlength="400" placeholder="Ask how to do something...">
            <button type="submit" id="manSend" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>
</div>
