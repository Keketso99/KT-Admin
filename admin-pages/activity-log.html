<div class="activity-page">

    <!-- =================================
         ACTIVITY HEADER
    ================================== -->

    <div class="activity-header">
        <div class="activity-header-text">
            <h2>
                <i class="fa-solid fa-clock-rotate-left"></i>
                Activity Logs
            </h2>
            <p>Complete application activity, transaction, user and security audit history.</p>
        </div>
    </div>


    <!-- =================================
         STATISTICS
    ================================== -->

    <div class="activity-stats">

        <div class="activity-card">
            <h4>Today</h4>
            <span id="todayActivities">0</span>
        </div>

        <div class="activity-card">
            <h4>Yesterday</h4>
            <span id="yesterdayActivities">0</span>
        </div>

    </div>


    <!-- =================================
         ACTIVITY CATEGORIES
    ================================== -->

    <div class="activity-tabs">

        <button class="activity-tab active" data-category="all"
            onclick="showActivityTab('all', this)">
            <span>All</span>
            <span class="activity-count" id="allCount">0</span>
        </button>

        <button class="activity-tab" data-category="login"
            onclick="showActivityTab('login', this)">
            <span>Login</span>
            <span class="activity-count" id="loginCount">0</span>
        </button>

        <button class="activity-tab" data-category="changes"
            onclick="showActivityTab('changes', this)">
            <span>Changes</span>
            <span class="activity-count" id="changesCount">0</span>
        </button>

        <button class="activity-tab" data-category="transactions"
            onclick="showActivityTab('transactions', this)">
            <span>Transactions</span>
            <span class="activity-count" id="transactionsCount">0</span>
        </button>

        <button class="activity-tab" data-category="users"
            onclick="showActivityTab('users', this)">
            <span>Users</span>
            <span class="activity-count" id="usersCount">0</span>
        </button>

        <button class="activity-tab" data-category="security"
            onclick="showActivityTab('security', this)">
            <span>Security</span>
            <span class="activity-count" id="securityCount">0</span>
        </button>

    </div>


    <!-- =================================
         SEARCH / TOOLBAR
    ================================== -->

    <div class="activity-tools">

        <div class="activity-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="activitySearch"
                autocomplete="off"
                placeholder="Search user, action, IP, device, ID...">
        </div>

 <button
    class="activity-refresh-btn"
    type="button"
    onclick="openDeleteActivityModal()"
    aria-label="Delete activity records">
    <i class="fa-solid fa-trash"></i>
    <span>Delete</span>
 </button>

    </div>


    <!-- =================================
         ACTIVITY TABLE
    ================================== -->

    <div class="activity-table-container">

        <table class="activity-table">

            <thead>
                <tr>
                    <th>User</th>
                    <th>Date</th>
                    <th>Activity</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="activityList"></tbody>

        </table>

    </div>


    <!-- =================================
         ACTIVITY DETAILS MODAL
    ================================== -->

    <div class="activity-modal" id="activityModal" aria-hidden="true">

        <div class="activity-modal-content" role="dialog" aria-modal="true" aria-labelledby="activityModalTitle">

            <div class="activity-modal-header">
                <div class="activity-modal-title-wrap">
                    <div class="activity-modal-title-icon">
                        <i class="fa-solid fa-clock-rotate-left" id="activityModalIcon"></i>
                    </div>
                    <div>
                        <h3 id="activityModalTitle">Activity Details</h3>
                        <span>Full audit record</span>
                    </div>
                </div>

                <button
                    class="activity-modal-close"
                    type="button"
                    aria-label="Close activity details"
                    onclick="closeActivityModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="activity-details" id="activityDetails">
                <!-- Details are inserted by activity-log.js -->
            </div>

            <div class="activity-modal-footer">
                <button
                    class="activity-close-btn"
                    type="button"
                    onclick="closeActivityModal()">
                    Close
                </button>
            </div>

        </div>

    </div>

<!-- =================================
     DELETE ACTIVITY CATEGORY MODAL
================================== -->

<div class="activity-delete-modal"
     id="activityDeleteModal"
     aria-hidden="true">

    <div class="activity-delete-modal-content"
         role="dialog"
         aria-modal="true"
         aria-labelledby="activityDeleteTitle">

        <div class="activity-delete-header">

            <div class="activity-delete-title-wrap">

                <div class="activity-delete-title-icon">
                    <i class="fa-solid fa-trash"></i>
                </div>

                <div>
                    <h3 id="activityDeleteTitle">
                        Delete Activity Records
                    </h3>

                    <span>
                        Choose which records to delete
                    </span>
                </div>

            </div>

            <button
                class="activity-delete-close"
                type="button"
                onclick="closeDeleteActivityModal()"
                aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="activity-delete-options">

            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('all')">

                <i class="fa-solid fa-layer-group"></i>

                <div>
                    <strong>All</strong>
                    <span>Delete all activity records</span>
                </div>

            </button>


            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('login')">

                <i class="fa-solid fa-right-to-bracket"></i>

                <div>
                    <strong>Login</strong>
                    <span>Delete login records</span>
                </div>

            </button>


            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('changes')">

                <i class="fa-solid fa-pen-to-square"></i>

                <div>
                    <strong>Changes</strong>
                    <span>Delete changes records</span>
                </div>

            </button>


            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('transactions')">

                <i class="fa-solid fa-money-bill-transfer"></i>

                <div>
                    <strong>Transactions</strong>
                    <span>Delete transaction records</span>
                </div>

            </button>


            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('users')">

                <i class="fa-solid fa-users"></i>

                <div>
                    <strong>Users</strong>
                    <span>Delete user activity records</span>
                </div>

            </button>


            <button
                type="button"
                class="activity-delete-option"
                onclick="requestDeleteActivityCategory('security')">

                <i class="fa-solid fa-shield-halved"></i>

                <div>
                    <strong>Security</strong>
                    <span>Delete security records</span>
                </div>

            </button>

        </div>

    </div>

</div>


<!-- =================================
     DELETE ACTIVITY CONFIRMATION MODAL
================================== -->

<div class="activity-delete-confirm-modal"
     id="activityDeleteConfirmModal"
     aria-hidden="true">

    <div class="activity-delete-confirm-content"
         role="dialog"
         aria-modal="true"
         aria-labelledby="activityDeleteConfirmTitle">

        <div class="activity-delete-confirm-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h3 id="activityDeleteConfirmTitle">
            Delete Activity Records?
        </h3>

        <p id="activityDeleteConfirmText">
            This action cannot be undone.
        </p>

        <div class="activity-delete-confirm-actions">

            <button
                type="button"
                class="activity-delete-cancel-btn"
                onclick="closeDeleteActivityConfirmModal()">
                Cancel
            </button>

            <button
                type="button"
                class="activity-delete-confirm-btn"
                id="confirmDeleteActivityBtn"
                onclick="confirmDeleteActivityRecords()">
                Delete
            </button>

        </div>

    </div>

</div>

</div>
