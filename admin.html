<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KT Admin Panel</title>
<link rel="stylesheet" href="dist/admin.bundle.css">
  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KT Admin">

<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">
<style>
/* KT startup splash — identical on every phone (logo + app name) */
#kt-splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
#kt-splash.kt-hide{opacity:0;pointer-events:none}
#kt-splash img{width:128px;height:128px;object-fit:contain;display:block;margin-top:-4vh}
#kt-splash .kt-splash-name{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);text-align:center;font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:22px;font-weight:400;letter-spacing:.2px;color:#202124;opacity:0;animation:ktNameIn .35s ease .1s forwards}
@keyframes ktNameIn{to{opacity:1}}
</style>
</head>
<body>

<div id="kt-splash" aria-hidden="true">
  <img src="icons/icon-512.png" alt="" width="128" height="128">
  <div class="kt-splash-name">KT Cloud Mining</div>
</div>
<script>
(function(){
  var shownAt = Date.now();
  var MIN_MS = 700;        // never flash by
  var MAX_MS = 6000;       // never get stuck
  var done = false;
  function remove(){
    var el = document.getElementById("kt-splash");
    if(!el) return;
    el.classList.add("kt-hide");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  window.ktHideSplash = function(){
    if(done) return;
    done = true;
    var wait = Math.max(0, MIN_MS - (Date.now() - shownAt));
    setTimeout(remove, wait);
  };
  setTimeout(function(){ window.ktHideSplash(); }, MAX_MS);
})();
</script>

<div id="login-overlay">
  <form id="login-form" onsubmit="loginSubmit(event)">
    <img src="copilot_image_1782453646122.jpeg" alt="KT Cloud Mining">
    <h2>Admin Sign In</h2>
    <p id="login-error"></p>
    <input type="email" id="login-email" placeholder="Email" required>
    <input type="password" id="login-password" placeholder="Password" required>
    <button type="submit" id="login-submit-btn">Sign In</button>
  </form>
</div>

<div id="admin-app">

<!-- HEADER -->
<header class="admin-header">
<button id="menu-btn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="logo">
<img src="copilot_image_1782453646122.jpeg">
</div>

<div class="admin-profile">
<i class="fa-solid fa-user-shield"></i>
Admin
<i class="fa-solid fa-right-from-bracket" id="logout-btn" style="margin-left:12px;cursor:pointer;" title="Log out" onclick="adminLogout()"></i>
</div>
  
</header>
  
<!-- SIDEBAR -->
<aside id="sidebar">

    <!-- FIXED ADMIN PROFILE -->
    <div class="sidebar-admin-profile" id="sidebarAdminProfile">

        <div class="sidebar-admin-avatar" id="sidebarAdminAvatar">
            A
        </div>

        <div class="sidebar-admin-info">
            <div class="sidebar-admin-name" id="sidebarAdminName">
                Admin
            </div>

            <div class="sidebar-admin-surname" id="sidebarAdminSurname">
            </div>
        </div>

    </div>

    <!-- FIXED SIDEBAR TITLE -->
    <div class="side-title">
        ADMIN MENU
    </div>

    <!-- SCROLLABLE MENU ONLY -->
    <div class="sidebar-menu-scroll">

        <div class="side-item active"
        onclick="loadAdminPage('dashboard')">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </div>

        <div class="side-item dropdown">
            <div onclick="toggleMenu(this)">
                <i class="fa-solid fa-wallet"></i>
                Finance
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>

            <div class="submenu">
                <div onclick="loadAdminPage('deposits')">
                    Deposits
                </div>

                <div onclick="loadAdminPage('withdrawals')">
                    Withdrawals
                </div>

                <div onclick="loadAdminPage('transactions')">
                    Transactions
                </div>
            </div>
        </div>

        <div class="side-item"
        onclick="loadAdminPage('plans')">
            <i class="fa-solid fa-coins"></i>
            Manage Plans
        </div>

        <div class="side-item"
        onclick="loadAdminPage('users')">
            <i class="fa-solid fa-users"></i>
            Users
        </div>

        <div class="side-item"
        onclick="loadAdminPage('verification')">
            <i class="fa-solid fa-id-card"></i>
            Verification
        </div>

        <div class="side-item"
        onclick="loadAdminPage('exchange')">
            <i class="fa-solid fa-money-bill-transfer"></i>
            Exchange Rates
        </div>

        <div class="side-item"
        onclick="loadAdminPage('support-chat')">
            <i class="fa-solid fa-comments"></i>
            Support Chat
        </div>

        <div class="side-item"
        onclick="loadAdminPage('notifications')">
            <i class="fa-solid fa-bell"></i>
            Notifications
        </div>

        <div class="side-item"
        onclick="loadAdminPage('activity-log')">
            <i class="fa-solid fa-clock-rotate-left"></i>
            Activity Logs
        </div>

        <div class="side-item"
        onclick="loadAdminPage('settings')">
            <i class="fa-solid fa-gear"></i>
            Settings
        </div>

        <div class="side-item side-logout-item"
        onclick="openLogoutModal()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </div>

    </div>

</aside>

<!-- GLOBAL PAGE LOADER -->
<div id="global-page-loader">
    <div class="global-loader-spinner"></div>
</div>
  
<!-- PAGE CONTENT -->
<main id="admin-body">
</main>
  
<!-- SIDEBAR OVERLAY (blurs + blocks clicks behind sidebar) -->
<div id="sidebar-overlay"></div>

<!-- =========================================================
     LOGOUT CONFIRMATION MODAL
========================================================= -->

<div class="logout-modal" id="logoutModal">

    <div class="logout-modal-content">

        <button
            type="button"
            class="logout-modal-close"
            onclick="closeLogoutModal()">
            &times;
        </button>

        <div class="logout-modal-icon">
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>

        <h2>Logout</h2>

        <p>
            Are you sure you want to logout?
        </p>

        <div class="logout-modal-actions">

            <button
                type="button"
                class="logout-cancel-btn"
                onclick="closeLogoutModal()">
                Cancel
            </button>

            <button
                type="button"
                class="logout-confirm-btn"
                onclick="confirmAdminLogout()">
                Confirm
            </button>

        </div>

    </div>

</div>

</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dist/admin.bundle.js"></script>
  
  
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>



</body>
</html>
