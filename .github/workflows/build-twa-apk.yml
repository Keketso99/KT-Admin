name: 3 - Build app like Chrome install (TWA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check key
        env:
          KT_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          [ -n "$KT_KEY_PASSWORD" ] || { echo "Secret KT_KEY_PASSWORD is missing."; exit 1; }
          [ -f android-app/signing/kt-release.p12 ] || { echo "No signing key yet. Run workflow '1 - Create signing key' first."; exit 1; }

      - name: Prepare
        run: |
          mkdir -p android-twa/signing
          cp android-app/signing/kt-release.p12 android-twa/signing/
          sed -i "s/\"appVersionCode\": 1/\"appVersionCode\": ${{ github.run_number }}/; s/\"appVersionName\": \"1.0.1\"/\"appVersionName\": \"1.0.${{ github.run_number }}\"/; s/\"appVersion\": \"1.0.1\"/\"appVersion\": \"1.0.${{ github.run_number }}\"/" android-twa/twa-manifest.json
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME"
          if [ ! -e "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            sudo rm -rf "$ANDROID_HOME/tools"
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          ls "$ANDROID_HOME/tools/bin" | head
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Build with Bubblewrap
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          printf 'y\ny\ny\ny\ny\n' | npx -y @bubblewrap/cli update --skipVersionUpgrade
          printf 'y\ny\ny\ny\ny\n' | npx -y @bubblewrap/cli build --skipPwaValidation
          ls -la

      - name: Domain link file (assetlinks.json)
        env:
          KT_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          FP=$(keytool -list -v -storetype PKCS12 -keystore android-app/signing/kt-release.p12 -alias kt -storepass "$KT_KEY_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          mkdir -p out
          cat > out/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.ktcloudmining.adminpwa",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          sed -i 's/^          //' out/assetlinks.json
          cat out/assetlinks.json
          cp android-twa/app-release-signed.apk out/KT-Admin-chrome-style.apk
          cp android-twa/app-release-bundle.aab out/KT-Admin.aab || true

      - uses: actions/upload-artifact@v4
        with:
          name: KT-Admin-TWA
          path: out/
