name: 2 - Build signed release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check key
        env:
          KT_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          [ -n "$KT_KEY_PASSWORD" ] || { echo "Secret KT_KEY_PASSWORD is missing."; exit 1; }
          [ -f android-app/signing/kt-release.p12 ] || { echo "No signing key yet. Run workflow '1 - Create signing key' first."; exit 1; }

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Create Android project
        working-directory: android-app
        run: npx cap add android

      - name: Microphone permission and version number
        working-directory: android-app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync
        working-directory: android-app
        run: npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease

      - name: Align and sign
        working-directory: android-app
        env:
          KT_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks signing/kt-release.p12 --ks-key-alias kt \
            --ks-pass env:KT_KEY_PASSWORD --key-pass env:KT_KEY_PASSWORD \
            --out KT-Admin-release.apk aligned.apk
          "$BT/apksigner" verify --print-certs KT-Admin-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KT-Admin-release-apk
          path: android-app/KT-Admin-release.apk
