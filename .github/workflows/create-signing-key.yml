name: 1 - Create signing key (run ONCE)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the key (never overwrites an existing one)
        env:
          KT_KEY_PASSWORD: ${{ secrets.KT_KEY_PASSWORD }}
        run: |
          if [ -z "$KT_KEY_PASSWORD" ]; then echo "Secret KT_KEY_PASSWORD is missing. Add it first (see README)."; exit 1; fi
          if [ ${#KT_KEY_PASSWORD} -lt 20 ]; then echo "KT_KEY_PASSWORD must be at least 20 characters."; exit 1; fi
          if [ -f android-app/signing/kt-release.p12 ]; then echo "A signing key already exists. Not touching it."; exit 1; fi
          mkdir -p android-app/signing
          keytool -genkeypair -storetype PKCS12 \
            -keystore android-app/signing/kt-release.p12 \
            -alias kt -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KT_KEY_PASSWORD" -keypass "$KT_KEY_PASSWORD" \
            -dname "CN=KT Admin, O=KT Cloud Mining, C=LS"

      - name: Save the key file in the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add android-app/signing/kt-release.p12
          git commit -m "Add Android signing key"
          git push
